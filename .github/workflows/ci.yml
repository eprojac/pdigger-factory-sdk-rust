name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: The crates carry the repository's LICENSE, NOTICE and CHANGELOG.md
        run: |
          for crate in crates/*/; do
            for file in LICENSE NOTICE CHANGELOG.md; do cmp "$file" "$crate$file"; done
          done

  test:
    name: unit tests in Docker (no network, 100 % coverage, golden files, examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disk room for the test image (removes preinstalled SDKs this job does not use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Build the test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.test
          tags: pdigger-factory-sdk-rust-test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: make test
        run: docker run --rm --network none pdigger-factory-sdk-rust-test

  msrv:
    name: minimum Rust versions (1.88 for the SDK, 1.95 for viz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - run: cargo +1.88 check -p pdigger-factory-sdk --all-features --locked
      - run: cargo +1.95 check -p pdigger-factory-viz --all-targets --locked

  docs:
    name: API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc, warnings denied
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: target/doc
