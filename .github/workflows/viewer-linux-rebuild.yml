name: Rebuild a release's Linux viewer

# Run by hand with a tag: builds that tag's Linux viewer as the release workflow does now (viewer-linux.yml, glibc 2.28)
# and replaces the Linux archive on that tag's GitHub release. The archives first released with 1.0.0 and 1.0.1 were
# built on the runner and needed glibc 2.43.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release whose Linux archive to rebuild and replace, for example v1.0.1"
        required: true
        type: string
      replace:
        description: "Upload the archive over the release's (off: build only, the archive stays an artifact of the run)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/viewer-linux.yml
    with:
      tag: ${{ inputs.tag }}

  replace:
    name: replace the Linux archive on the release
    if: inputs.replace
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: viewer-x86_64-unknown-linux-gnu
          path: dist
      - name: Upload over the release's Linux archive
        run: gh release upload "$TAG" "dist/pdigger-factory-viewer-$TAG-x86_64-unknown-linux-gnu.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
