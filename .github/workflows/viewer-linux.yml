name: Linux viewer

# The Linux viewer archive of a tag, built in a manylinux_2_28 container (AlmaLinux 8), so that the viewer runs on
# glibc 2.28 and later (RHEL 8, Debian 10, Ubuntu 20.04 and newer). Built on the runner itself it needed the runner's
# glibc (2.43 on ubuntu-26.04). The release workflow calls it for a new tag, and viewer-linux-rebuild.yml for an
# existing release.
on:
  workflow_call:
    inputs:
      tag:
        description: "The tag whose viewer to build, for example v1.0.1 (it names the archive)"
        required: true
        type: string
      ref:
        description: "The commit to build (default: the tag), so that a release run builds the commit it was started for"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: viewer binary (x86_64-unknown-linux-gnu, glibc 2.28)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64:2026.11.07-1@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || format('refs/tags/{0}', inputs.tag) }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: x86_64-unknown-linux-gnu
      - run: cargo build -p pdigger-factory-viz --bin pdigger-factory-viewer --release --locked --target x86_64-unknown-linux-gnu
      - name: The viewer needs glibc 2.28 at most
        shell: bash
        run: |
          newest=$(objdump -T target/x86_64-unknown-linux-gnu/release/pdigger-factory-viewer | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -n 1)
          echo "the newest glibc symbol version the viewer needs: $newest"
          test -n "$newest"
          test "$(printf '%s\nGLIBC_2.28\n' "$newest" | sort -V | tail -n 1)" = GLIBC_2.28
      - name: The viewer starts on this image's glibc 2.28 (--help returns before any window opens)
        run: target/x86_64-unknown-linux-gnu/release/pdigger-factory-viewer --help
      - name: Package
        shell: bash
        run: |
          name="pdigger-factory-viewer-${TAG}-x86_64-unknown-linux-gnu"
          mkdir "$name"
          cp LICENSE NOTICE README.md "$name/"
          # the licences of the crates the binary is built from (NOTICE names this file); the image's CPython 3.12
          /opt/python/cp312-cp312/bin/python scripts/third-party-licenses.py --target x86_64-unknown-linux-gnu > "$name/THIRD-PARTY-LICENSES.txt"
          cp target/x86_64-unknown-linux-gnu/release/pdigger-factory-viewer "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: viewer-x86_64-unknown-linux-gnu
          path: pdigger-factory-viewer-*.tar.gz
          if-no-files-found: error
